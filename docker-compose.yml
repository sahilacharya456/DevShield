services:
  db:
    image: postgres:15-alpine
    container_name: devshield_postgres
    restart: always
    environment:
      POSTGRES_USER: devshield_user
      POSTGRES_PASSWORD: devshield_password
      POSTGRES_DB: devshield_db
    ports:
      - "5432:5432"
    volumes:
      - devshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devshield_user -d devshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devshield_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - devshield_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devshield_backend
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devshield_user:devshield_password@db:5432/devshield_db
      POSTGRES_USER: devshield_user
      POSTGRES_PASSWORD: devshield_password
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: devshield_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: devshield_worker
    restart: on-failure
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://devshield_user:devshield_password@db:5432/devshield_db
      POSTGRES_USER: devshield_user
      POSTGRES_PASSWORD: devshield_password
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: devshield_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.worker.celery_app worker --loglevel=info

  frontend:
    build:
      context: ./frontend
    container_name: devshield_frontend
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  devshield_pgdata:
  devshield_redisdata:
